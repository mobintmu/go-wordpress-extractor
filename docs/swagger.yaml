basePath: /
definitions:
  ActiveRequests:
    properties:
      extract_active_requests:
        example: 0
        type: integer
    required:
    - extract_active_requests
    type: object
  ApiError:
    properties:
      code:
        example: INVALID_URL
        type: string
      message:
        example: The url must be an absolute http or https URL.
        type: string
    required:
    - code
    - message
    type: object
  Evidence:
    properties:
      attempts:
        example: 1
        type: integer
      body_bytes:
        example: 184233
        type: integer
      body_sha256:
        example: 9f2c0d7ab1
        type: string
      content_type:
        example: text/html; charset=UTF-8
        type: string
      failed_url:
        example: https://badomjip.com/product/example/
        format: uri
        type: string
      field_samples:
        additionalProperties:
          type: string
        description: Raw text found for each field.
        type: object
      final_url:
        example: https://badomjip.com/product/example/
        format: uri
        type: string
      html_sample:
        $ref: '#/definitions/HtmlSample'
      http_status:
        example: 200
        type: integer
      page_title:
        example: Example product - Badomjip
        type: string
      redirects:
        items:
          type: string
        type: array
      response_headers:
        additionalProperties:
          type: string
        description: 'Allow-listed headers only: server, content-type, retry-after,
          cf-ray, cf-mitigated, location. Never Set-Cookie.'
        type: object
      search:
        allOf:
        - $ref: '#/definitions/SearchEvidence'
        description: What a search engine searched for. Set only for the duckduckgo
          and brave engines.
      selector_trace:
        description: Match count for each step of the failing selector path.
        items:
          $ref: '#/definitions/SelectorTraceStep'
        type: array
    type: object
  ExtractError:
    properties:
      code:
        description: |-
          Failure code. New codes can be added over time, so treat unknown codes like INTERNAL_ERROR.
          Known codes: SITE_NOT_CONFIGURED, SITE_DISABLED, CONFIG_INVALID, NOT_PRODUCT_URL, URL_NOT_ALLOWED,
          DNS_FAILED, CONNECTION_FAILED, TLS_FAILED, FETCH_TIMEOUT, HTTP_NOT_FOUND, ACCESS_DENIED, RATE_LIMITED,
          SOURCE_SERVER_ERROR, HTTP_ERROR, ROBOTS_DISALLOWED, REDIRECT_NOT_ALLOWED, TOO_MANY_REDIRECTS,
          UNSUPPORTED_CONTENT, RESPONSE_TOO_LARGE, BOT_PROTECTION, JS_RENDERED_PAGE, EMPTY_PAGE, SELECTOR_NOT_FOUND,
          REQUIRED_FIELD_MISSING, PRICE_PARSE_FAILED, DEADLINE_EXCEEDED, INTERNAL_ERROR, ENGINE_UNAVAILABLE,
          SEARCH_NO_RESULT, SEARCH_PROVIDER_BLOCKED, SEARCH_QUOTA_EXCEEDED, SEARCH_PROVIDER_AUTH_FAILED, SEARCH_PROVIDER_ERROR.
        example: SELECTOR_NOT_FOUND
        type: string
      confidence:
        enum:
        - high
        - medium
        example: high
        type: string
      message:
        example: The product block was not found on the page.
        type: string
      owner:
        enum:
        - client
        - site_config
        - source_site
        - service
        example: site_config
        type: string
      retryable:
        example: false
        type: boolean
      root_cause:
        example: The page returned HTTP 200 with real content, but selector 'div.product.type-product'
          matched 0 elements. The site markup has probably changed.
        type: string
      stage:
        enum:
        - config
        - fetch
        - page_check
        - extract
        - normalize
        - validate
        example: extract
        type: string
      suggested_action:
        example: Update pages.product.root in configs/sites/badomjip.com.json.
        type: string
    required:
    - code
    - confidence
    - message
    - owner
    - retryable
    - root_cause
    - stage
    type: object
  ExtractRequest:
    properties:
      request_id:
        description: Echoed in the response and logs. Generated if missing.
        example: client-generated-id-123
        maxLength: 128
        type: string
      url:
        description: One product page, on a domain with a site config.
        example: https://badomjip.com/product/example/
        format: uri
        type: string
    required:
    - url
    type: object
  ExtractResponse:
    properties:
      completeness:
        description: full when unavailable_fields is empty, partial otherwise. Set
          on success.
        enum:
        - full
        - partial
        example: partial
        type: string
      config_version:
        example: 2026-11-08.1
        type: string
      duration_ms:
        example: 3120
        type: integer
      error:
        allOf:
        - $ref: '#/definitions/ExtractError'
        description: Set on failed.
      evidence:
        allOf:
        - $ref: '#/definitions/Evidence'
        description: Set on failed.
      finished_at:
        example: "2026-11-08T10:00:03Z"
        type: string
      partial:
        allOf:
        - $ref: '#/definitions/Partial'
        description: Set on failed.
      product:
        allOf:
        - $ref: '#/definitions/Product'
        description: Set on success.
      request_id:
        example: client-generated-id-123
        type: string
      site_id:
        description: Missing when no site config matched.
        example: badomjip
        type: string
      source:
        allOf:
        - $ref: '#/definitions/Source'
        description: Which fetch engine produced the data. Set once a fetch was attempted.
      started_at:
        example: "2026-11-08T10:00:00Z"
        type: string
      status:
        enum:
        - success
        - failed
        example: success
        type: string
      unavailable_fields:
        description: Every product field that is not in the response, with the reason.
          Always an array on success; also set on failed when partial.product is.
        items:
          $ref: '#/definitions/UnavailableField'
        type: array
      url:
        example: https://badomjip.com/product/example/
        format: uri
        type: string
      warnings:
        description: Set on success; always an array.
        items:
          $ref: '#/definitions/Warning'
        type: array
    required:
    - duration_ms
    - request_id
    - status
    - url
    type: object
  HealthResponse:
    properties:
      message:
        example: OK
        type: string
    required:
    - message
    type: object
  HtmlSample:
    properties:
      content:
        description: Untrusted third-party HTML. Escape before displaying.
        example: <div class="site-content">...</div>
        type: string
      original_length:
        example: 48211
        type: integer
      reason:
        example: Deepest element matched by the failing selector path
        type: string
      truncated:
        example: true
        type: boolean
    required:
    - content
    - reason
    - truncated
    type: object
  MetricsBucket:
    properties:
      count:
        example: 40
        type: integer
      le_seconds:
        example: 5
        type: number
    required:
    - count
    - le_seconds
    type: object
  MetricsHistogram:
    properties:
      avg_seconds:
        example: 3.13
        type: number
      buckets:
        items:
          $ref: '#/definitions/MetricsBucket'
        type: array
      count:
        example: 42
        type: integer
      sum_seconds:
        example: 131.4
        type: number
    required:
    - avg_seconds
    - buckets
    - count
    - sum_seconds
    type: object
  MetricsLoad:
    properties:
      active:
        description: Active is the number of extractions running now.
        example: 3
        type: integer
      available:
        description: Available is Capacity minus Active; 0 means the next request
          gets 429.
        example: 5
        type: integer
      capacity:
        description: Capacity is the most extractions this instance runs at once.
        example: 8
        type: integer
      draining:
        description: Draining is true while the instance shuts down; send nothing
          to it.
        example: false
        type: boolean
      per_site_limit:
        description: PerSiteLimit is the most extractions that run at once for one
          site.
        example: 1
        type: integer
      sites_active:
        additionalProperties:
          type: integer
        description: |-
          SitesActive maps each busy site_id to its running extractions.
          A site at PerSiteLimit makes new requests for it wait or get 429.
        type: object
      utilization:
        description: Utilization is Active divided by Capacity, from 0 to 1.
        example: 0.375
        type: number
    required:
    - active
    - available
    - capacity
    - draining
    - per_site_limit
    - sites_active
    - utilization
    type: object
  MetricsReport:
    properties:
      durations:
        additionalProperties:
          $ref: '#/definitions/MetricsHistogram'
        type: object
      generated_at:
        example: "2026-11-11T08:00:00Z"
        type: string
      instance:
        example: extractor-1
        type: string
      load:
        $ref: '#/definitions/MetricsLoad'
      rejected:
        additionalProperties:
          format: int64
          type: integer
        type: object
      requests:
        items:
          $ref: '#/definitions/MetricsRequestCount'
        type: array
      started_at:
        example: "2026-11-11T07:00:00Z"
        type: string
    required:
    - durations
    - generated_at
    - instance
    - load
    - rejected
    - requests
    - started_at
    type: object
  MetricsRequestCount:
    properties:
      code:
        example: ""
        type: string
      count:
        example: 42
        type: integer
      outcome:
        enum:
        - success
        - failed
        - cancelled
        example: success
        type: string
      price_state:
        example: available
        type: string
      site_id:
        example: hmland
        type: string
    required:
    - count
    - outcome
    type: object
  Partial:
    properties:
      product:
        allOf:
        - $ref: '#/definitions/Product'
        x-nullable: true
    required:
    - product
    type: object
  Price:
    properties:
      currency:
        description: IRT means the amounts are toman; USD and EUR mean the amounts
          are cents.
        enum:
        - IRT
        - USD
        - EUR
        example: IRT
        type: string
      current:
        description: Price in toman (IRT), US cents (USD), or euro cents (EUR). The
          lowest price when the page shows a range. Null when no price is available,
          never 0.
        example: 400000
        type: integer
        x-nullable: true
      raw:
        description: Text as it appeared on the page.
        example: 500,000 تومان 400,000 تومان
        type: string
      regular:
        description: Regular price before any sale, in the same unit as current. The
          lowest value when the page shows a range.
        example: 500000
        type: integer
        x-nullable: true
      state:
        description: out_of_stock means the product cannot be ordered.
        enum:
        - available
        - call_for_price
        - out_of_stock
        - unknown
        example: available
        type: string
    required:
    - state
    type: object
  Product:
    properties:
      description:
        example: |-
          First paragraph.
          Second paragraph.
        type: string
        x-nullable: true
      image_url:
        example: https://badomjip.com/wp-content/uploads/example.jpg
        format: uri
        type: string
        x-nullable: true
      price:
        $ref: '#/definitions/Price'
      specs:
        description: |-
          Name/value pairs from the page's specifications, in page order. Only
          set when the site config defines pages.product.specs and the page has
          at least one pair.
        items:
          $ref: '#/definitions/Spec'
        type: array
      title:
        example: Example product
        type: string
      url:
        description: Canonical URL when it is on the site's domains, otherwise the
          final URL.
        example: https://badomjip.com/product/example/
        format: uri
        type: string
    required:
    - url
    type: object
  SearchEvidence:
    properties:
      cached:
        description: True when the answer came from the instance's cache and no query
          was sent for this request.
        example: false
        type: boolean
      closest:
        description: Up to 3 result URLs on the same site, for a person to check.
          Never used as the product.
        items:
          type: string
        type: array
      engine:
        example: duckduckgo
        type: string
      queries:
        items:
          $ref: '#/definitions/SearchQuery'
        type: array
    required:
    - cached
    - engine
    - queries
    type: object
  SearchQuery:
    properties:
      matched:
        example: false
        type: boolean
      query:
        example: site:hafele.com.de universalverbinder haefele ixconnect uc 16 64
        type: string
      results:
        description: Number of web results that came back.
        example: 10
        type: integer
    required:
    - query
    type: object
  SelectorTraceStep:
    properties:
      matches:
        example: 1
        type: integer
      selector:
        example: div.main-page-wrapper
        type: string
    required:
    - matches
    - selector
    type: object
  Site:
    properties:
      currency:
        enum:
        - IRT
        - USD
        - EUR
        example: IRT
        type: string
      domains:
        example:
        - hmland.ir
        - www.hmland.ir
        items:
          type: string
        type: array
      site_id:
        example: hmland
        type: string
      template:
        example: woodmart
        type: string
      version:
        example: 2026-11-11.1
        type: string
    required:
    - currency
    - domains
    - site_id
    - template
    - version
    type: object
  SiteList:
    properties:
      count:
        example: 1
        type: integer
      loaded_at:
        example: "2026-11-11T08:00:00Z"
        type: string
      sites:
        items:
          $ref: '#/definitions/Site'
        type: array
    required:
    - count
    - loaded_at
    - sites
    type: object
  Source:
    properties:
      cached:
        description: True when the search answer came from the instance's cache.
        example: false
        type: boolean
      engine:
        enum:
        - http
        - browser
        - duckduckgo
        - brave
        example: duckduckgo
        type: string
      query:
        description: The search query whose results held the product. Search engines
          only.
        example: site:fergusonhome.com duravit 030549 0hole
        type: string
      result_rank:
        description: The product's 1-based position in the search results. Search
          engines only.
        example: 1
        type: integer
      site_contacted:
        description: False for the search engines, which never contact the product's
          site.
        example: false
        type: boolean
    required:
    - engine
    - site_contacted
    type: object
  Spec:
    properties:
      group:
        description: The heading of the group the pair is in, when the page groups
          them.
        example: Details
        type: string
      name:
        example: Finish
        type: string
      value:
        example: Honed
        type: string
    required:
    - name
    - value
    type: object
  UnavailableField:
    properties:
      field:
        enum:
        - title
        - image_url
        - description
        - price
        - availability
        - specs
        example: price
        type: string
      message:
        example: Search results do not include prices.
        type: string
      reason:
        enum:
        - NOT_ON_PAGE
        - NOT_IN_SEARCH_RESULTS
        - NOT_CONFIGURED
        example: NOT_IN_SEARCH_RESULTS
        type: string
    required:
    - field
    - message
    - reason
    type: object
  Warning:
    properties:
      code:
        example: FIELD_MISSING
        type: string
      field:
        example: image_url
        type: string
      message:
        example: The image_url field was not found on this product page.
        type: string
    required:
    - code
    - message
    type: object
info:
  contact: {}
  description: Operator credentials (APP_OPS_USER and APP_OPS_PASSWORD_HASH) for Swagger
    UI.
  title: Product Extraction API
  version: "1.0"
paths:
  /api/v1/active:
    get:
      description: Returns how many extraction requests this instance is processing
        at this moment.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ActiveRequests'
        "401":
          description: 'UNAUTHORIZED: the API key is missing, unknown, revoked, or
            expired.'
          schema:
            $ref: '#/definitions/ApiError'
      security:
      - ApiKeyAuth: []
      summary: Number of extractions running now
      tags:
      - Operations
  /api/v1/extract:
    post:
      consumes:
      - application/json
      description: |-
        Fetches one product page and returns the product (status success) or the root cause with evidence (status failed).
        Both results return HTTP 200, so clients must read the status field. Only error.code HTTP_NOT_FOUND means the product is gone.
        Each request responds within APP_MAX_REQUEST_DURATION (3 minutes); set the client timeout to 190 seconds.
      parameters:
      - description: One product page URL
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ExtractRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Processing ran. Read the status field for the result.
          schema:
            $ref: '#/definitions/ExtractResponse'
        "400":
          description: 'INVALID_REQUEST: body is not valid JSON, exceeds 1 MiB, or
            url is missing. INVALID_URL: url is malformed or not http/https.'
          schema:
            $ref: '#/definitions/ApiError'
        "401":
          description: 'UNAUTHORIZED: the API key is missing, unknown, revoked, or
            expired.'
          schema:
            $ref: '#/definitions/ApiError'
        "429":
          description: 'TOO_MANY_REQUESTS: no capacity, or the site already has a
            running extraction.'
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              type: integer
          schema:
            $ref: '#/definitions/ApiError'
        "503":
          description: 'SHUTTING_DOWN: this instance is draining.'
          schema:
            $ref: '#/definitions/ApiError'
      security:
      - ApiKeyAuth: []
      summary: Extract one product from a product page
      tags:
      - Extraction
  /api/v1/sites:
    get:
      description: |-
        Returns the sites named in configs/active_sites.json whose config is valid and enabled, sorted by site_id.
        Disabled and invalid configs, and active domains without a config, are left out. Without active_sites.json, every enabled site is returned.
        The list follows config hot reloads; loaded_at is when the current configs were loaded.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SiteList'
        "401":
          description: 'UNAUTHORIZED: the API key is missing, unknown, revoked, or
            expired.'
          schema:
            $ref: '#/definitions/ApiError'
      security:
      - ApiKeyAuth: []
      summary: List websites available for extraction
      tags:
      - Extraction
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: Check that the process is running
      tags:
      - Operations
  /metrics:
    get:
      description: |-
        Returns JSON by default: live load (capacity, active, available, busy sites, draining) and the counters since start.
        Clients can poll each instance and send the next request to the one with the most available slots that is not draining.
        Send Accept: text/plain (Prometheus does this) or ?format=prometheus to get the Prometheus text format instead.
      parameters:
      - description: Response format
        enum:
        - json
        - prometheus
        in: query
        name: format
        type: string
      produces:
      - application/json
      - text/plain
      responses:
        "200":
          description: JSON report, or the Prometheus text format when asked for
          schema:
            $ref: '#/definitions/MetricsReport'
        "401":
          description: 'UNAUTHORIZED: the API key is missing, unknown, revoked, or
            expired.'
          schema:
            $ref: '#/definitions/ApiError'
      security:
      - ApiKeyAuth: []
      summary: Instance load and metrics
      tags:
      - Operations
  /ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthResponse'
        "503":
          description: 'SHUTTING_DOWN: this instance is draining.'
          schema:
            $ref: '#/definitions/ApiError'
      summary: Check that this instance accepts new requests
      tags:
      - Operations
securityDefinitions:
  ApiKeyAuth:
    description: 'Client API key: gwp_<id>_<secret>'
    in: header
    name: X-API-Key
    type: apiKey
  OpsBasicAuth:
    type: basic
swagger: "2.0"
tags:
- description: Product extraction for client applications.
  name: Extraction
- description: Health, readiness, and operator endpoints.
  name: Operations
