<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="implements" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M1 1L11 6L1 11z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    </marker>
    <marker id="holds" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto">
      <path d="M1 5L8 1L15 5L8 9z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="800" fill="#ffffff"/>

  <text x="24" y="36" font-size="18" font-weight="600" fill="#0f172a">Fetch engines: Strategy pattern, chosen per site by &quot;fetch.engine&quot;</text>
  <text x="24" y="58" font-size="12.5" fill="#64748b">The service sees one Fetcher; the Router picks a strategy from the site config; Colly stays the default.</text>

  <!-- Client -->
  <g>
    <rect x="310" y="84" width="340" height="64" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.25"/>
    <text x="480" y="104" text-anchor="middle" font-size="11.5" fill="#64748b">Client</text>
    <text x="480" y="124" text-anchor="middle" font-weight="600" fill="#0f172a">extract.Service</text>
    <text x="480" y="140" text-anchor="middle" font-size="11.5" fill="#475569">calls Fetch() through the extract.Fetcher interface</text>
  </g>

  <path d="M480 148V188" fill="none" stroke="#475569" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="490" y="172" font-size="11.5" fill="#64748b">Fetch(ctx, site, url)</text>

  <!-- Context -->
  <g>
    <rect x="250" y="190" width="460" height="124" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="480" y="210" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Context</text>
    <text x="480" y="230" text-anchor="middle" font-weight="600" font-size="15" fill="#0f172a">fetch.Router</text>
    <line x1="266" y1="240" x2="694" y2="240" stroke="#bfdbfe"/>
    <text x="268" y="260" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0f172a">engines  map[string]Engine   // &quot;http&quot;, &quot;browser&quot;</text>
    <text x="268" y="278" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0f172a">fallback string             // &quot;http&quot;</text>
    <line x1="266" y1="288" x2="694" y2="288" stroke="#bfdbfe"/>
    <text x="268" y="306" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0f172a">Fetch(): engines[site.Fetch.Engine].Fetch(...)</text>
  </g>

  <!-- Config -->
  <g>
    <rect x="740" y="196" width="200" height="112" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.25" stroke-dasharray="5 4"/>
    <text x="840" y="216" text-anchor="middle" font-size="11.5" fill="#b45309">Site config</text>
    <text x="756" y="238" font-size="11.5" fill="#0f172a">configs/sites/&lt;domain&gt;.json</text>
    <text x="756" y="262" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#0f172a">&quot;fetch&quot;: {</text>
    <text x="756" y="278" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#0f172a">  &quot;engine&quot;: &quot;browser&quot;</text>
    <text x="756" y="294" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#0f172a">}</text>
  </g>
  <path d="M740 252H712" fill="none" stroke="#d97706" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="726" y="340" text-anchor="middle" font-size="11.5" fill="#b45309">selects the strategy</text>
  <text x="726" y="355" text-anchor="middle" font-size="11.5" fill="#b45309">(missing → &quot;http&quot;)</text>

  <!-- Router holds Engine -->
  <path d="M480 314V384" fill="none" stroke="#475569" stroke-width="1.25" marker-start="url(#holds)" marker-end="url(#arrow)"/>
  <text x="492" y="354" font-size="11.5" fill="#64748b">holds 1..n, delegates to one</text>

  <!-- Strategy interface -->
  <g>
    <rect x="270" y="386" width="420" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.25"/>
    <text x="480" y="406" text-anchor="middle" font-size="11.5" fill="#64748b">Strategy  «interface»</text>
    <text x="480" y="426" text-anchor="middle" font-weight="600" font-size="15" fill="#0f172a">fetch.Engine</text>
    <line x1="286" y1="436" x2="674" y2="436" stroke="#e2e8f0"/>
    <text x="288" y="456" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0f172a">Name() string</text>
    <text x="288" y="474" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0f172a">Fetch(ctx, site, url) (*Page, *Failure)</text>
  </g>

  <!-- implements arrows -->
  <path d="M230 560V524H420V488" fill="none" stroke="#475569" stroke-width="1.25" stroke-dasharray="6 4" marker-end="url(#implements)"/>
  <path d="M730 560V524H540V488" fill="none" stroke="#475569" stroke-width="1.25" stroke-dasharray="6 4" marker-end="url(#implements)"/>
  <text x="480" y="540" text-anchor="middle" font-size="11.5" fill="#64748b">implements</text>

  <!-- Concrete strategy: HTTP -->
  <g>
    <rect x="40" y="562" width="380" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="230" y="582" text-anchor="middle" font-size="11.5" fill="#15803d">Concrete strategy · engine &quot;http&quot; (default)</text>
    <text x="230" y="604" text-anchor="middle" font-weight="600" font-size="15" fill="#0f172a">fetch.Fetcher  (Colly)</text>
    <text x="56" y="628" font-size="12" fill="#0f172a">• existing code, kept as is (+ Name() = &quot;http&quot;)</text>
    <text x="56" y="646" font-size="12" fill="#0f172a">• Go net/http, SafeDialer, cookie jar per site</text>
    <text x="56" y="664" font-size="12" fill="#0f172a">• retries, Retry-After, proxy, body limit</text>
  </g>

  <!-- Concrete strategy: Browser -->
  <g>
    <rect x="540" y="562" width="380" height="120" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="730" y="582" text-anchor="middle" font-size="11.5" fill="#7e22ce">Concrete strategy · engine &quot;browser&quot;</text>
    <text x="730" y="604" text-anchor="middle" font-weight="600" font-size="15" fill="#0f172a">fetch.BrowserFetcher</text>
    <text x="556" y="628" font-size="12" fill="#0f172a">• Playwright → real Chrome</text>
    <text x="556" y="646" font-size="12" fill="#0f172a">• one browser per instance, fresh context per request</text>
    <text x="556" y="664" font-size="12" fill="#0f172a">• route handler enforces the SSRF checks</text>
  </g>

  <!-- Outbound -->
  <path d="M230 682V716" fill="none" stroke="#475569" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M730 682V716" fill="none" stroke="#475569" stroke-width="1.25" marker-end="url(#arrow)"/>
  <g>
    <rect x="80" y="718" width="300" height="44" rx="8" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <text x="230" y="745" text-anchor="middle" font-size="12" fill="#475569">Shop server: plain HTTP request</text>
  </g>
  <g>
    <rect x="580" y="718" width="300" height="44" rx="8" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <text x="730" y="745" text-anchor="middle" font-size="12" fill="#475569">Shop server: page rendered in Chrome</text>
  </g>

  <text x="480" y="788" text-anchor="middle" font-size="11.5" fill="#64748b">Adding an engine = one new type that implements fetch.Engine + one line registering it in the Router.</text>
</svg>
